<om-retro-grid [gridColor]="'#fff'" [fadeColor]="'rgb(15, 15, 15)'">
  <app-toast />

  <div class="content">
    <h1 class="sm:sfont-l text-center">Sala de Juegos</h1>

    <div class="flex flex-row gap-8">
      <app-acceso-juego ruta="/home" imagen="media/juegos/ahorcado.png"></app-acceso-juego>
      <app-acceso-juego ruta="/home" imagen="media/juegos/mayormenor.png"></app-acceso-juego>
      <app-acceso-juego ruta="/home" imagen="media/juegos/preguntad2.png"></app-acceso-juego>
      <app-acceso-juego ruta="/home" imagen="media/juegos/wordle.png"></app-acceso-juego>
    </div>
    @if (!sb.usuarioLogueado()) {
      <div class="flex gap-10">
        <app-login></app-login>
        <p-button
          label="Registrarse"
          size="large"
          routerLink="/register"
          icon="pi pi-user-plus"
          class=""
        ></p-button>
      </div>
    }
  </div>
</om-retro-grid>
