      <!--   <path id="arcBottom" d="M76.1511 42.5586C73.8898 60.1668 59.3915 74.4089 40.8144 75.8454C38.7059 76.0085 36.6235 76.0004 34.581 75.8332" stroke="#1EAC68" stroke-width="2.25"/> -->

    </svg>
  </div>
  }@else{
  <div>

    <h1 class="text-center">Perdiste!!</h1>

    <div class="hidden" [ngClass]="{
            'mostrar-animacion': victoria === false
          }">
      <svg width="122" height="122" viewBox="0 0 122 122" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path class="circle"
          d="M61 117.538C92.2253 117.538 117.538 92.2252 117.538 60.9999C117.538 29.7746 92.2253 4.46143 61 4.46143C29.7747 4.46143 4.46155 29.7746 4.46155 60.9999C4.46155 92.2252 29.7747 117.538 61 117.538Z"

          stroke-dashoffset="600" />
        <path class="line1" d="M83 39.8728L39.8728 83" stroke="currentColor" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="120" stroke-dashoffset="120" />
        <path class="line2" d="M39.8728 39.8728L83 83" stroke="currentColor" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="120" stroke-dashoffset="120" />

    </div>
  </div>

  <div>
    <p-button label="Volver a Jugar" type="button" (click)="reiniciar()" [text]="true"
      styleClass="!p-4 w-full border-green !border-white/30 hover:!bg-green" class="w-full text-primary" />
    <p-button label="Salir al Menu" type="button" (click)="abandonar()" [text]="true"
      styleClass="!p-4 w-full !text-white hover:!bg-white/10" class="w-full" />
  </div>

</div>
