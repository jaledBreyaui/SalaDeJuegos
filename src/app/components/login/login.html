<div class="card flex justify-center">
  <p-button (click)="showDialog()" icon="pi pi-user" size="large" label="Ingresar" />
  <p-dialog
    maskStyleClass="backdrop-blur-sm"
    [(visible)]="visible"
    styleClass="!border-0 !bg-transparent"
  >
    <ng-template #headless>
      <div
        class="flex flex-col justify-evenly p-8 gap-6 mx-auto w-full min-h-[450px] min-w-[450px] sm:px-6 md:max-w-2xl lg:max-w-xl bg-zinc-900 rounded-2xl"
        style="border-radius: 12px"
      >
        <h1 class="text-center font-bold text-2xl">Bienvenido</h1>
        <p-inputgroup class="flex w-full">
          <p-inputgroup-addon class="flex w-12 shrink-0 items-center justify-center text-slate-300">
            <i class="pi pi-user text-sm text-slate-300"></i>
          </p-inputgroup-addon>
          <input
            class="w-full min-w-0"
            pInputText
            name="usuario"
            [(ngModel)]="usuario"
            placeholder="Usuario"
            autocomplete="username"
          />
        </p-inputgroup>
        <p-inputgroup class="flex w-full">
          <p-inputgroup-addon class="flex w-12 shrink-0 items-center justify-center text-slate-300">
            <i class="pi pi-lock text-sm text-slate-300"></i>
          </p-inputgroup-addon>
          <input
            class="w-full min-w-0"
            pInputText
            name="password"
            type="password"
            [(ngModel)]="password"
            placeholder="Contraseña"
            autocomplete="current-password"
          />
        </p-inputgroup>
        <a
          routerLink="/register"
          class="-mt-3 ml-1 text-sm text-gray-400 underline underline-offset-4 transition-colors hover:text-gray-300"
        >
          No estoy registrado
        </a>
        <div class="flex flex-col items-center gap-4">
          <p-button
            label="Ingresar"
            (click)="closeDialog()"
            [text]="true"
            styleClass="!p-4 w-full border-green !border-white/30 hover:!bg-green"
            class="w-full text-primary !border-emerald-300 !text-white"
          />
          <p-button
            label="Volver"
            (click)="closeDialog()"
            [text]="true"
            styleClass="!p-4 w-full !text-primary-50 hover:!bg-white/10"
            class="w-full"
          />
        </div>
      </div>
    </ng-template>
  </p-dialog>
</div>
