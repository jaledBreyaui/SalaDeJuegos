<div class="card flex justify-center">
  <p-button (onClick)="showDialog()" icon="pi pi-user" size="large" label="Ingresar" />
  <p-dialog
    maskStyleClass="backdrop-blur-sm"
    [visible]="visible()"
    (visibleChange)="visible.set($event)"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [dismissableMask]="true"
    appendTo="body"
    position="center"
    styleClass="login-dialog"
  >
    <ng-template #headless class="">
      <form
        [formGroup]="formularioLogin"
        class="login-form"
        [ngClass]="{
          erroralingresar: errorAlIngresar(),
        }"
      >
        <h1 class="text-center font-bold text-2xl">Bienvenido</h1>
        <p-inputgroup class="flex w-full">
          <p-inputgroup-addon class="flex w-12 shrink-0 items-center justify-center text-slate-300">
            <i class="pi pi-user text-sm text-slate-300"></i>
          </p-inputgroup-addon>
          <input
            class="w-full min-w-0"
            pInputText
            name="correo"
            formControlName="correo"
            placeholder="Usuario"
            autocomplete="username"
          />
        </p-inputgroup>
        <p-inputgroup class="flex w-full">
          <p-inputgroup-addon class="flex w-12 shrink-0 items-center justify-center text-slate-300">
            <i class="pi pi-lock text-sm text-slate-300"></i>
          </p-inputgroup-addon>
          <input
            class="w-full min-w-0"
            pInputText
            name="password"
            type="password"
            formControlName="password"
            placeholder="Contraseña"
            autocomplete="current-password"
          />
        </p-inputgroup>
        <div class="flex items-center gap-2">
          <p-checkbox inputId="loginRapido" formControlName="loginRapido" [binary]="true" />
          <label for="loginRapido" class="text-sm text-gray-400">Completar datos de prueba</label>
        </div>
        <a
          routerLink="/register"
          class="-mt-3 ml-1 text-sm text-gray-400 underline underline-offset-4 transition-colors hover:text-gray-300"
        >
          No estoy registrado
        </a>
        <div class="flex flex-col items-center gap-4">
          <p-button
            label="Ingresar"
            type="button"
            [disabled]="formularioLogin.invalid"
            (onClick)="iniciarSesion()"
            [text]="true"
            styleClass="!p-4 w-full border-green !border-white/30 hover:!bg-green"
            class="w-full text-primary"
          />
          <p-button
            label="Volver"
            type="button"
            (click)="closeDialog()"
            [text]="true"
            styleClass="!p-4 w-full !text-primary-50 hover:!bg-white/10"
            class="w-full"
          />
        </div>
      </form>
    </ng-template>
  </p-dialog>
</div>
