<div class="flex gap-20 flex-col p-10">
  <h1 class="text-center">wordle</h1>
  <h1 class="text-center">{{ this.palabraSecreta() }}</h1>
  <div class="contenedor-intentos flex flex-col gap-2">
    @for (intento of intentos; track $index; let intentoIndex = $index) {
    <form [formGroup]="intento" class="flex justify-center"
      (keydown.enter)="verificarIntento(intento, intentoIndex, $event)">
      @for (letra of letras; track letra; let letraIndex = $index) {
      <input #casillero [ngClass]="clasesLetrasProbadas[intentoIndex][letraIndex]" type="text" pInputText maxlength="1"
        autocomplete="off" [readOnly]="intentoIndex !== intentoActual" [formControlName]="letra"
        (input)="normalizarLetra(intento, letra, intentoIndex, letraIndex, $event)"
        (keydown.backspace)="manejarBackspace(intento, letra, intentoIndex, letraIndex)" />
      }
    </form>
    }
  </div>
  <button (click)="mostrarFinJuego()">terminar</button>
</div>
<app-pantallafindejuego [victoria]="victoria()" [ngClass]="{
    'mostrar': juegoTerminado() === true,
    'ocultar': juegoTerminado() === false,
    'victoria': victoria() === true,
    'derrota': victoria() === false,
  }"></app-pantallafindejuego>
